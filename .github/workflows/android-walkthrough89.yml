name: Android Walkthrough89 (registry full pass)

# 89 入口逐屏走查（2026-11-17）：在模拟器里跑 V5RuntimeInstrumentation
# 的 walkthrough89 模式——先做原 7 页实拍，再按 EntryRegistry 89 条
# 逐项走真实用户路径（抽屉 / 首页 pill / 顶栏 / 全部功能弹窗逐行点按），
# 每项写一行结果到 walkthrough89-results.txt，已实现项逐屏截图
# wt-<id>.png。单项失败是走查数据，不让 job 变红；只有走查没跑完
# （无 WALKTHROUGH89_DONE 行）才算 job 失败。
# 成本门：workflow_dispatch 需工作流在默认分支上才可用（本文件只在
# 走查分支上，故 API dispatch 返回 404）；改为「推本分支且改动安卓/
# 本工作流才跑」+ dispatch 双触发，普通分支推送不触发。
on:
  push:
    branches:
      - feat/walkthrough-89-android-20261117
    paths:
      - "android/**"
      - ".github/workflows/android-walkthrough89.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  walkthrough89:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: Build app and instrumentation APKs
        run: gradle -p android -PandroidAbis=x86_64 :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Run walkthrough89 on API 34 emulator (KVM)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -x
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            mkdir -p emulator-evidence
            adb logcat -c
            adb shell am instrument -w -e allowTaskCreation true -e walkthrough89 true wherevercode.agent.ci.test/wherevercode.agent.V5RuntimeInstrumentation 2>&1 | tee emulator-evidence/instrumentation.txt
            adb pull /sdcard/Android/data/wherevercode.agent.ci/files/v5-runtime emulator-evidence/ || true
            ls -la emulator-evidence/v5-runtime/ || true
            adb logcat -d > emulator-evidence/logcat.txt || true
            grep -q "WALKTHROUGH89_DONE" emulator-evidence/v5-runtime/walkthrough89-results.txt
      - name: Summarize walkthrough89 results
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_walkthrough89.py emulator-evidence/v5-runtime/walkthrough89-results.txt || true
      - name: Verify runtime captures (anti fake-green, legacy 7 pages)
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_v5_runtime.py emulator-evidence
      - name: Upload walkthrough evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough89-android-${{ github.sha }}
          path: emulator-evidence/
          if-no-files-found: warn
          retention-days: 14
