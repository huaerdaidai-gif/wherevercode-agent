name: Android Emulator Acceptance (iOS-align remodel)

# 安卓照 iOS 改（2026-11-16）逐页截图验收。跑本分支自己的
# V5RuntimeInstrumentation（android/app/build.gradle.kts 里
# testInstrumentationRunner 指定的那个）：它走真实抽屉路径
# 依次打开 对话/项目/频道/控制/账号设置，逐页实拍 PNG 到
# 外部存储 v5-runtime/，不造假数据。本分支没有
# FlagshipActivity 深链，也不跑 JUnit instrumentation 测试，
# 故 instrument 命令必须指 V5RuntimeInstrumentation（指
# AndroidJUnitRunner 会立即 INSTRUMENTATION_FAILED，见
# bf8462be 轮教训）。
# 成本门（Funk 2026-11-14）：普通推送不烧模拟器；仅手动 dispatch
# 或提交信息带 [emu] 才真跑。
on:
  push:
    branches:
      - feat/android-ui-ios-align-20261116
    paths:
      - "android/**"
      - ".github/workflows/android-emulator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[emu]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: Build app and instrumentation APKs
        run: gradle -p android -PandroidAbis=x86_64 :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Run on API 34 emulator (KVM)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -x
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            mkdir -p emulator-evidence
            adb logcat -c
            adb shell am instrument -w -e allowTaskCreation true wherevercode.agent.ci.test/wherevercode.agent.V5RuntimeInstrumentation 2>&1 | tee emulator-evidence/instrumentation.txt
            adb shell screencap -p /sdcard/final-screen.png || true
            adb pull /sdcard/final-screen.png emulator-evidence/ || true
            adb pull /sdcard/Android/data/wherevercode.agent.ci/files/v5-runtime emulator-evidence/ || true
            ls -la emulator-evidence/v5-runtime/ || true
            adb logcat -d > emulator-evidence/logcat.txt || true
            grep -q "V5_RUNTIME_OK" emulator-evidence/instrumentation.txt
      - name: Verify runtime captures (anti fake-green)
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_v5_runtime.py emulator-evidence
      - name: Upload emulator evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence-${{ github.sha }}
          path: emulator-evidence/
          if-no-files-found: warn
          retention-days: 14
