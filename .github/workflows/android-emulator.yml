name: Android Emulator Acceptance (iOS-align remodel)

# 安卓照 iOS 改（2026-11-16）逐页截图验收。复用组装线
# android-emulator.yml 的稳定配方（GitHub 托管 ubuntu + KVM +
# API 34 google_apis x86_64 + swiftshader），但只跑本分支的
# RemodelScreenshotTest（六页：对话首页/抽屉/项目/频道/控制/
# 全部功能弹窗），不跑组装线才有的 FlagshipNavTest/PageCaptureTest
#（本分支没有 FlagshipActivity 深链）。
# 成本门（Funk 2026-11-14）：普通推送不烧模拟器；仅手动 dispatch
# 或提交信息带 [emu] 才真跑。
on:
  push:
    branches:
      - feat/android-ui-ios-align-20261116
    paths:
      - "android/**"
      - ".github/workflows/android-emulator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[emu]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: Build app and instrumentation APKs
        run: gradle -p android -PandroidAbis=x86_64 :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Run on API 34 emulator (KVM)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -x
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            mkdir -p emulator-evidence
            adb logcat -c
            adb shell am instrument -w -e allowTaskCreation true -e class wherevercode.agent.ui.RemodelScreenshotTest wherevercode.agent.ci.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee emulator-evidence/instrumentation.txt
            adb shell screencap -p /sdcard/final-screen.png || true
            adb pull /sdcard/final-screen.png emulator-evidence/ || true
            mkdir -p emulator-evidence/page-capture
            adb exec-out run-as wherevercode.agent.ci tar -c files/page-capture 2>/dev/null | tar -x -C emulator-evidence/page-capture --strip-components=2 || true
            ls -la emulator-evidence/page-capture/ || true
            adb logcat -d > emulator-evidence/logcat.txt || true
            grep -q "OK (" emulator-evidence/instrumentation.txt
      - name: Verify page-capture evidence (anti fake-green)
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_page_capture.py emulator-evidence 01-chat-home.png 02-sidebar.png 03-projects.png 04-channels.png 05-console.png 06-feature-center.png
      - name: Upload emulator evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence-${{ github.sha }}
          path: emulator-evidence/
          if-no-files-found: warn
          retention-days: 14
