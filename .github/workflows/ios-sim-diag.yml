              echo "ATTEMPT$i FAIL rc=$rc" | tee -a diag.txt
              collect_diag
            fi
            xcrun simctl uninstall "$UDID" com.wc.diag.hello >/dev/null 2>&1 || true
          done
          if [ "$ok" = "1" ]; then
            echo "VERDICT cell=D result=INSTALL_OK" >> diag.txt
            exit 0
          fi
          echo "VERDICT cell=D result=INSTALL_FAIL" >> diag.txt
          exit 1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-cell-d
          path: diag.txt
          retention-days: 7
          if-no-files-found: warn
