        run: |
          set -euo pipefail
          mkdir -p HelloDiag.app
          cat > main.swift <<'SWIFT'
          import UIKit

          final class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let w = UIWindow(frame: UIScreen.main.bounds)
                  let vc = UIViewController()
                  vc.view.backgroundColor = .systemBackground
                  let label = UILabel(frame: vc.view.bounds)
                  label.text = "HelloDiag"
                  label.textAlignment = .center
                  vc.view.addSubview(label)
                  w.rootViewController = vc
                  w.makeKeyAndVisible()
                  window = w
                  return true
              }
          }

          UIApplicationMain(CommandLine.argc, CommandLine.unsafeArgv, nil, NSStringFromClass(AppDelegate.self))
          SWIFT
          cat > HelloDiag.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>HelloDiag</string>
              <key>CFBundleIdentifier</key>
              <string>com.wc.diag.hello</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>HelloDiag</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          PLIST
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          ARCH="$(uname -m)"
          echo "sdk=$SDK arch=$ARCH"
          swiftc -target ${ARCH}-apple-ios15.0-simulator -sdk "$SDK" -O -o HelloDiag.app/HelloDiag main.swift
          codesign --force --deep --sign - HelloDiag.app
          ls -la HelloDiag.app
      - name: Install attempts with diagnostics
        run: |
          set -uo pipefail
          : > diag.txt
          echo "cell=D" >> diag.txt
          run_with_idle_cap() {
            local idle_cap="$1" total_cap="$2"; shift 2
            local logf shown=0 waited=0 last_output=0 size rc
            logf="$(mktemp)"
            "$@" >"$logf" 2>&1 &
            local pid=$!
            while kill -0 "$pid" 2>/dev/null; do
              sleep 10
              waited=$((waited + 10))
              size=$(stat -f %z "$logf")
              if [ "$size" -gt "$shown" ]; then
                tail -c +$((shown + 1)) "$logf"
                shown=$size
                last_output=$waited
              fi
              if [ $((waited - last_output)) -ge "$idle_cap" ]; then
                echo "WEDGED: no output for ${idle_cap}s from: $*"
                kill "$pid" 2>/dev/null || true
                sleep 2
                kill -9 "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                rm -f "$logf"
                return 124
              fi
              if [ "$waited" -ge "$total_cap" ]; then
                echo "TIMEOUT: total ${total_cap}s exceeded: $*"
                kill "$pid" 2>/dev/null || true
                sleep 2
                kill -9 "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                rm -f "$logf"
                return 124
              fi
            done
            wait "$pid"; rc=$?
            size=$(stat -f %z "$logf")
            if [ "$size" -gt "$shown" ]; then
              tail -c +$((shown + 1)) "$logf"
            fi
            rm -f "$logf"
            return $rc
          }
          collect_diag() {
            {
              echo "--- simctl list devices ---"
              xcrun simctl list devices 2>&1 | head -40
              echo "--- ps CoreSimulator/installd ---"
              ps aux | grep -E 'CoreSimulator|installd|launchd_sim' | grep -v grep | head -20
              echo "--- CoreSimulator log dir ---"
              ls -lt ~/Library/Logs/CoreSimulator/ 2>/dev/null | head -10
              newest=$(ls -t ~/Library/Logs/CoreSimulator/*.log 2>/dev/null | head -1)
              if [ -n "${newest:-}" ]; then echo "--- tail $newest ---"; tail -50 "$newest"; fi
            } >> diag.txt 2>&1 || true
          }
          UDID="$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
