                kill -9 "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                rm -f "$logf"
                return 124
              fi
              if [ "$waited" -ge "$total_cap" ]; then
                echo "TIMEOUT: total ${total_cap}s exceeded: $*"
                kill "$pid" 2>/dev/null || true
                sleep 2
                kill -9 "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                rm -f "$logf"
                return 124
              fi
            done
            wait "$pid"; rc=$?
            size=$(stat -f %z "$logf")
            if [ "$size" -gt "$shown" ]; then
              tail -c +$((shown + 1)) "$logf"
            fi
            rm -f "$logf"
            return $rc
          }
          collect_diag() {
            {
              echo "--- simctl list devices ---"
              xcrun simctl list devices 2>&1 | head -40
              echo "--- ps CoreSimulator/installd ---"
              ps aux | grep -E 'CoreSimulator|installd|launchd_sim' | grep -v grep | head -20
              echo "--- CoreSimulator log dir ---"
              ls -lt ~/Library/Logs/CoreSimulator/ 2>/dev/null | head -10
              newest=$(ls -t ~/Library/Logs/CoreSimulator/*.log 2>/dev/null | head -1)
              if [ -n "${newest:-}" ]; then echo "--- tail $newest ---"; tail -50 "$newest"; fi
            } >> diag.txt 2>&1 || true
          }
          RT="$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          rts = [r for r in data['runtimes'] if r.get('isAvailable') and r.get('name', '').startswith('iOS')]
          rts.sort(key=lambda r: r.get('version', ''))
          print(rts[-1]['identifier'] if rts else '')
          ")"
          DT="$(xcrun simctl list devicetypes -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          dts = [d for d in data['devicetypes'] if 'iPhone' in d.get('name', '')]
          dts.sort(key=lambda d: ('iPhone 15' not in d['name'], d['name']))
          print(dts[0]['identifier'] if dts else '')
          ")"
          echo "runtime=$RT devicetype=$DT" | tee -a diag.txt
          if [ -z "$RT" ] || [ -z "$DT" ]; then echo "VERDICT cell=C result=NO_RUNTIME" >> diag.txt; exit 1; fi
          UDID="$(xcrun simctl create DiagFresh "$DT" "$RT")"
          echo "created UDID=$UDID" | tee -a diag.txt
          run_with_idle_cap 120 120 xcrun simctl boot "$UDID" || true
          if ! run_with_idle_cap 120 300 xcrun simctl bootstatus "$UDID" -b; then
            if ! xcrun simctl list devices available | grep "$UDID" | grep -q "(Booted)"; then
              echo "VERDICT cell=C result=BOOT_FAIL" >> diag.txt
              collect_diag
              exit 1
            fi
            echo "device Booted despite bootstatus silence"
          fi
          APP=.build/derived/Build/Products/Debug-iphonesimulator/WhereverCodeAgent.app
          ok=0
          for i in 1 2; do
            echo "=== install attempt $i $(date +%T) ==="
            if run_with_idle_cap 180 300 xcrun simctl install "$UDID" "$APP"; then
              echo "ATTEMPT$i OK" | tee -a diag.txt
              ok=1
            else
              rc=$?
              echo "ATTEMPT$i FAIL rc=$rc" | tee -a diag.txt
              collect_diag
            fi
            xcrun simctl uninstall "$UDID" wherevercode.agent >/dev/null 2>&1 || true
          done
          if [ "$ok" = "1" ]; then
            echo "VERDICT cell=C result=INSTALL_OK" >> diag.txt
            exit 0
          fi
          echo "VERDICT cell=C result=INSTALL_FAIL" >> diag.txt
          exit 1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-cell-c
          path: diag.txt
          retention-days: 7
          if-no-files-found: warn

  cell-d:
    name: D hello-world preprovisioned-sim
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Print runner environment
        run: |
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          sw_vers || true
          uname -m
          ls -d /Applications/Xcode*.app || true
          XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1 || true)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; echo "Using $XCODE"; fi
          xcodebuild -version
          xcrun simctl list runtimes
