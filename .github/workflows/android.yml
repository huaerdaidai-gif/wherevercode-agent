name: Android CI
on:
  push:
    branches:
      - main
      - "integ/**"
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.0"
      - name: Run JVM tests and build debug APK
        run: gradle -p android :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wherevercode-agent-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
