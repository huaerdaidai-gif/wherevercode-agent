name: Android CI
on:
  push:
    branches:
      - main
      - "integ/**"
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Hand server tests
        run: |
          python -m pip install --only-binary=:all: 'cryptography>=41,<47'
          python -m unittest server.test_hand_server -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.0"
      - name: Run JVM tests
        run: gradle -p android :app:testDebugUnitTest --stacktrace
      - name: Build debug and compatibility APKs
        if: ${{ !cancelled() }}
        run: gradle -p android :app:assembleDebug :app:assembleCompat --stacktrace
      - name: Upload unit test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: wherevercode-agent-test-reports-${{ github.sha }}
          path: |
            android/app/build/reports/tests/testDebugUnitTest/**
            android/app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14
      - name: Upload debug APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: wherevercode-agent-ci-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Upload compatibility APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: wherevercode-agent-compat-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/compat/*.apk
          if-no-files-found: warn
          retention-days: 14
