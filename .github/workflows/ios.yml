# iOS — WhereverCode Agent (unsigned IPA)
#
# Builds the native Swift/SwiftUI app on a GitHub-hosted macOS runner,
# runs the XCTest suite (unit + UI tests) on an iPhone simulator,
# exports the screenshot attachments from the test result bundle as
# the "ios-screenshots-simulator" artifact, then packages an
# UNSIGNED .app into an .ipa for self-signed sideloading (Sideloadly /
# AltStore). No user signing identity is ever stored in CI.
#
# The repository is public, so Actions runs here do not consume the
# private-repo $12/month compute allowance.

name: iOS

on:
  push:
    branches: ["**"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    # Same-repository pushes already test the exact source SHA. Avoid a
    # duplicate PR run cancelling its still-starting macOS worker. Forks
    # still need the pull_request build because their pushes do not run here.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Verify 70-Screen Contract & E2E Wiring
        run: |
          set -euo pipefail
          python3 scripts/verify_ios_v5_assembly.py
          python3 scripts/run_e2e_wiring_tests.py

      - name: Select latest stable Xcode on the runner
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app || true
          XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1 || true)"
          if [ -n "$XCODE" ]; then
            echo "Using $XCODE"
            sudo xcode-select -s "$XCODE"
          else
            echo "No Xcode_*.app found; using the runner default."
          fi
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          phones = [d for runtimes in data['devices'].values() for d in runtimes
                    if d.get('isAvailable') and 'iPhone' in d.get('name', '')]
          phones.sort(key=lambda d: ('iPhone 17' not in d['name'], d['name']))
          print(phones[0]['udid'] if phones else '')
          ")"
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Build (unsigned, generic iOS device)
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/WhereverCodeAgent.xcodeproj \
            -scheme WhereverCodeAgent \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/derived \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$(find .build/derived/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "No .app found under Release-iphoneos:"
            find .build/derived/Build/Products -maxdepth 2 -print
            exit 1
          fi
          echo "Packaging $APP"
          rm -rf Payload WhereverCodeAgent-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -r -y WhereverCodeAgent-unsigned.ipa Payload
          /usr/bin/zip -T WhereverCodeAgent-unsigned.ipa
          ls -lh WhereverCodeAgent-unsigned.ipa

      - name: Verify IPA version matches pbxproj (D5 gate)
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import plistlib, re, sys, zipfile, tempfile, os
          pbx = open('ios/WhereverCodeAgent.xcodeproj/project.pbxproj').read()
          mv = set(re.findall(r'MARKETING_VERSION = ([0-9.]+);', pbx))
          cv = set(re.findall(r'CURRENT_PROJECT_VERSION = (\d+);', pbx))
          assert len(mv) == 1 and len(cv) == 1, f'version not unique in pbxproj: {mv} {cv}'
          exp_v, exp_b = mv.pop(), cv.pop()
          with tempfile.TemporaryDirectory() as td:
              with zipfile.ZipFile('WhereverCodeAgent-unsigned.ipa') as z:
                  name = [n for n in z.namelist() if n.endswith('.app/Info.plist')][0]
                  plist_path = os.path.join(td, 'Info.plist')
                  open(plist_path, 'wb').write(z.read(name))
              d = plistlib.load(open(plist_path, 'rb'))
          got_v, got_b = d.get('CFBundleShortVersionString'), d.get('CFBundleVersion')
          print(f'expected {exp_v} ({exp_b}); IPA has {got_v} ({got_b})')
          if got_v != exp_v or str(got_b) != exp_b:
              print('VERSION GATE FAILED: IPA version missing, unexpanded, or not equal to pbxproj')
              sys.exit(1)
          print('VERSION GATE PASSED')
          PYEOF

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: WhereverCodeAgent-unsigned-ipa
          path: WhereverCodeAgent-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Build and capture live simulator launch
        run: |
          set -euo pipefail
          UDID='${{ steps.sim.outputs.udid }}'
          xcodebuild build \
            -project ios/WhereverCodeAgent.xcodeproj \
            -scheme WhereverCodeAgent \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath .build/derived \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY="-"
          # Boot wedge detection (2026-11-19, run #201 evidence): a wedged
          # CoreSimulator boot prints NOTHING (9.4 min of total silence)
          # and the device never reaches (Booted). But silence alone is
          # not proof: run #210 (2026-11-20) showed a healthy boot whose
          # bootstatus printed nothing for 139s while the device did
          # reach (Booted). So idle output only triggers a state check;
          # the actual device state is the ground truth that decides.
          run_with_idle_cap() {
            local idle_cap="$1" total_cap="$2"; shift 2
            local logf shown=0 waited=0 last_output=0 size rc
            logf="$(mktemp)"
            "$@" >"$logf" 2>&1 &
            local pid=$!
            while kill -0 "$pid" 2>/dev/null; do
              sleep 10
              waited=$((waited + 10))
              size=$(stat -f %z "$logf")
              if [ "$size" -gt "$shown" ]; then
                tail -c +$((shown + 1)) "$logf"
                shown=$size
                last_output=$waited
              fi
              if [ $((waited - last_output)) -ge "$idle_cap" ]; then
                echo "WEDGED: no output for ${idle_cap}s from: $*"
                kill "$pid" 2>/dev/null || true
                sleep 2
                kill -9 "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                rm -f "$logf"
                return 124
              fi
              if [ "$waited" -ge "$total_cap" ]; then
                echo "TIMEOUT: total ${total_cap}s exceeded: $*"
                kill "$pid" 2>/dev/null || true
                sleep 2
                kill -9 "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                rm -f "$logf"
                return 124
              fi
            done
            wait "$pid"; rc=$?
            size=$(stat -f %z "$logf")
            if [ "$size" -gt "$shown" ]; then
              tail -c +$((shown + 1)) "$logf"
            fi
            rm -f "$logf"
            return $rc
          }
          run_with_idle_cap 120 120 xcrun simctl boot "$UDID" || true
          if ! run_with_idle_cap 120 300 xcrun simctl bootstatus "$UDID" -b; then
            echo "bootstatus monitor ended early; verifying actual device state:"
            xcrun simctl list devices available | grep "$UDID" || true
            if ! xcrun simctl list devices available | grep "$UDID" | grep -q "(Booted)"; then
              echo "simulator boot did not complete; simulator state:"
              xcrun simctl list devices available | grep "$UDID" || true
              exit 1
            fi
            echo "device is Booted; continuing despite bootstatus silence"
          fi
          mkdir -p .build/live-launch
          xcrun simctl list devices available > .build/live-launch/devices.txt
          # Install/launch wedge guard (2026-11-27, batch-5 evidence): on
          # sick runner hosts simctl install hangs silently forever after
          # a successful boot (two runs ate the full 20-min hard line).
          # Same idle-cap pattern as the boot guard above: fail fast so
          # the run goes red in minutes and can be re-dispatched.
          run_with_idle_cap 180 300 xcrun simctl install "$UDID" .build/derived/Build/Products/Debug-iphonesimulator/WhereverCodeAgent.app
          run_with_idle_cap 120 180 xcrun simctl launch --terminate-running-process "$UDID" wherevercode.agent > .build/live-launch/launch.txt
          cat .build/live-launch/launch.txt
          sleep 5
          xcrun simctl io "$UDID" screenshot .build/live-launch/ios-home.png

      - name: Upload live simulator launch
        uses: actions/upload-artifact@v4
        with:
          name: ios-live-launch
          path: .build/live-launch
          retention-days: 30
          if-no-files-found: error

      - name: Package simulator app
        run: |
          set -euo pipefail
          rm -f WhereverCodeAgent-simulator-app.zip
          (cd .build/derived/Build/Products/Debug-iphonesimulator && /usr/bin/zip -r -y "${GITHUB_WORKSPACE}/WhereverCodeAgent-simulator-app.zip" WhereverCodeAgent.app)
          ls -lh WhereverCodeAgent-simulator-app.zip

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: WhereverCodeAgent-simulator-app.zip
          retention-days: 30
          if-no-files-found: error

      - name: Test navigation on iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild test \
            -project ios/WhereverCodeAgent.xcodeproj \
            -scheme WhereverCodeAgent \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
            -derivedDataPath .build/derived \
            -parallel-testing-enabled NO \
            -resultBundlePath .build/UIResults.xcresult \
            -only-testing:WhereverCodeAgentUITests \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="-"

      - name: Test on iOS Simulator
        if: ${{ !cancelled() }}
        # Ad-hoc signed ("Sign to Run Locally", identity "-"): the
        # simulator Keychain refuses unsigned apps with -34018
        # (errSecMissingEntitlement), which would fail the Keychain
        # tests for an environment reason, not a code reason. No real
        # identity or certificate is involved; the shipped IPA above
        # stays fully unsigned.
        run: |
          set -euo pipefail
          rm -rf .build/TestResults.xcresult
          xcodebuild test \
            -project ios/WhereverCodeAgent.xcodeproj \
            -scheme WhereverCodeAgent \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
            -derivedDataPath .build/derived \
            -parallel-testing-enabled NO \
            -resultBundlePath .build/TestResults.xcresult \
            -only-testing:WhereverCodeAgentTests \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="-"

      - name: Export simulator screenshots
        # Screenshot evidence lives in the test result bundle as
        # XCTAttachments (page renders from the unit tests + live UI
        # test captures). Export them so they can be reviewed without
        # opening the whole bundle. Never fail the job over this —
        # the test step above is the gate.
        if: always()
        run: |
          set -uo pipefail
          mkdir -p .build/screenshots
          for RESULTS in .build/UIResults.xcresult .build/TestResults.xcresult; do
            if [ -f "$RESULTS/Info.plist" ]; then
              OUT=".build/screenshots/$(basename "$RESULTS" .xcresult)"
              mkdir -p "$OUT"
              xcrun xcresulttool export attachments --path "$RESULTS" --output-path "$OUT" || true
              xcrun xcresulttool export diagnostics --path "$RESULTS" --output-path "$OUT/diagnostics" || true
            fi
          done
          mkdir -p .build/screenshots/diagnostics
          cp ~/Library/Logs/DiagnosticReports/WhereverCodeAgent*.ips .build/screenshots/diagnostics/ 2>/dev/null || true
          find .build/screenshots -type f | sort | head -80 || true

      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots-simulator
          path: .build/screenshots
          retention-days: 30
          if-no-files-found: warn
