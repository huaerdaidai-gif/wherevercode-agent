# iOS — WhereverCode Agent (unsigned IPA)
#
# Builds the native Swift/SwiftUI app on a GitHub-hosted macOS runner,
# runs the XCTest suite (unit + UI tests) on an iPhone simulator,
# exports the screenshot attachments from the test result bundle as
# the "ios-screenshots-simulator" artifact, then packages an
# UNSIGNED .app into an .ipa for self-signed sideloading (Sideloadly /
# AltStore). No user signing identity is ever stored in CI.
#
# The repository is public, so Actions runs here do not consume the
# private-repo $12/month compute allowance.

name: iOS

on:
  push:
    branches: ["**"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select latest stable Xcode on the runner
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app || true
          XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1 || true)"
          if [ -n "$XCODE" ]; then
            echo "Using $XCODE"
            sudo xcode-select -s "$XCODE"
          else
            echo "No Xcode_*.app found; using the runner default."
          fi
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          phones = [d for runtimes in data['devices'].values() for d in runtimes
                    if d.get('isAvailable') and 'iPhone' in d.get('name', '')]
          phones.sort(key=lambda d: ('iPhone 17' not in d['name'], d['name']))
          print(phones[0]['udid'] if phones else '')
          ")"
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Build (unsigned, generic iOS device)
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/WhereverCodeAgent.xcodeproj \
            -scheme WhereverCodeAgent \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/derived \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$(find .build/derived/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "No .app found under Release-iphoneos:"
            find .build/derived/Build/Products -maxdepth 2 -print
            exit 1
          fi
          echo "Packaging $APP"
          rm -rf Payload WhereverCodeAgent-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -r -y WhereverCodeAgent-unsigned.ipa Payload
          /usr/bin/zip -T WhereverCodeAgent-unsigned.ipa
          ls -lh WhereverCodeAgent-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: WhereverCodeAgent-unsigned-ipa
          path: WhereverCodeAgent-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Build and capture live simulator launch
        run: |
          set -euo pipefail
          UDID='${{ steps.sim.outputs.udid }}'
          xcodebuild build \
            -project ios/WhereverCodeAgent.xcodeproj \
            -scheme WhereverCodeAgent \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath .build/derived \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY="-"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          mkdir -p .build/live-launch
          xcrun simctl list devices available > .build/live-launch/devices.txt
          xcrun simctl install "$UDID" .build/derived/Build/Products/Debug-iphonesimulator/WhereverCodeAgent.app
          xcrun simctl launch --terminate-running-process "$UDID" wherevercode.agent | tee .build/live-launch/launch.txt
          sleep 5
          xcrun simctl io "$UDID" screenshot .build/live-launch/ios-home.png

      - name: Upload live simulator launch
        uses: actions/upload-artifact@v4
        with:
          name: ios-live-launch
          path: .build/live-launch
          retention-days: 30
          if-no-files-found: error

      - name: Test navigation on iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild test \
            -project ios/WhereverCodeAgent.xcodeproj \
            -scheme WhereverCodeAgent \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
            -derivedDataPath .build/derived \
            -parallel-testing-enabled NO \
            -resultBundlePath .build/UIResults.xcresult \
            -only-testing:WhereverCodeAgentUITests \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="-"

      - name: Test on iOS Simulator
        if: ${{ !cancelled() }}
        # Ad-hoc signed ("Sign to Run Locally", identity "-"): the
        # simulator Keychain refuses unsigned apps with -34018
        # (errSecMissingEntitlement), which would fail the Keychain
        # tests for an environment reason, not a code reason. No real
        # identity or certificate is involved; the shipped IPA above
        # stays fully unsigned.
        run: |
          set -euo pipefail
          rm -rf .build/TestResults.xcresult
          xcodebuild test \
            -project ios/WhereverCodeAgent.xcodeproj \
            -scheme WhereverCodeAgent \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
            -derivedDataPath .build/derived \
            -parallel-testing-enabled NO \
            -resultBundlePath .build/TestResults.xcresult \
            -only-testing:WhereverCodeAgentTests \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="-"

      - name: Export simulator screenshots
        # Screenshot evidence lives in the test result bundle as
        # XCTAttachments (page renders from the unit tests + live UI
        # test captures). Export them so they can be reviewed without
        # opening the whole bundle. Never fail the job over this —
        # the test step above is the gate.
        if: always()
        run: |
          set -uo pipefail
          mkdir -p .build/screenshots
          for RESULTS in .build/UIResults.xcresult .build/TestResults.xcresult; do
            if [ -f "$RESULTS/Info.plist" ]; then
              OUT=".build/screenshots/$(basename "$RESULTS" .xcresult)"
              mkdir -p "$OUT"
              xcrun xcresulttool export attachments --path "$RESULTS" --output-path "$OUT" || true
              xcrun xcresulttool export diagnostics --path "$RESULTS" --output-path "$OUT/diagnostics" || true
            fi
          done
          mkdir -p .build/screenshots/diagnostics
          cp ~/Library/Logs/DiagnosticReports/WhereverCodeAgent*.ips .build/screenshots/diagnostics/ 2>/dev/null || true
          find .build/screenshots -type f | sort | head -80 || true

      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots-simulator
          path: .build/screenshots
          retention-days: 30
          if-no-files-found: warn
