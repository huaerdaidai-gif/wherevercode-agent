name: Hand
on:
  push:
    branches: [task/t4-hand-unify, feat/native-dual-ui-delivery-20261114, main]
    paths:
      - 'server/**'
      - 'android/app/src/main/python/agent_runner.py'
      - 'scripts/*hand*'
      - 'android/app/src/main/assets/install/**'
      - '.github/workflows/hand.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - 'server/**'
      - 'android/app/src/main/python/agent_runner.py'
      - 'scripts/*hand*'
      - 'android/app/src/main/assets/install/**'
      - '.github/workflows/hand.yml'
      - '.gitattributes'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify committed bytes (read-only)
        run: |
          set -o pipefail
          git rev-parse HEAD
          python3 scripts/sync_hand_server.py --check 2>&1 | tee hand-drift.log
      - name: Verify checker rejects drift and missing assets
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee hand-drift-probes.log
          import pathlib, shutil, subprocess, sys, tempfile
          root = pathlib.Path.cwd()
          with tempfile.TemporaryDirectory() as directory:
              copy = pathlib.Path(directory)
              for name in ("scripts/sync_hand_server.py", "server/hand_server.py",
                           "android/app/src/main/assets/install/hand_server.py"):
                  target = copy / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(root / name, target)
              script = copy / "scripts/sync_hand_server.py"
              asset = copy / "android/app/src/main/assets/install/hand_server.py"
              def check(expected, *args):
                  result = subprocess.run([sys.executable, str(script), *args], cwd=directory)
                  assert result.returncode == expected, (args, result.returncode, expected)
              check(0, "--check")
              asset.write_bytes(asset.read_bytes() + b"\n# intentional CI drift probe\n")
              check(1, "--check")
              asset.unlink()
              check(1, "--check")
              check(0, "--write")
              check(0, "--check")
          PY
      - name: Preserve byte-check and negative-probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hand-drift-${{ github.sha }}
          path: hand-drift*.log
          if-no-files-found: warn
  tests:
    name: Hand functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Hand dependency
        run: python3 -m pip install cryptography
      - name: Run all existing and added Hand tests
        run: |
          set -o pipefail
          git rev-parse HEAD
          python3 -m unittest discover -s server -p 'test_*.py' -v 2>&1 | tee hand-tests.log
      - name: Preserve test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hand-tests-${{ github.sha }}
          path: hand-tests.log
          if-no-files-found: warn
